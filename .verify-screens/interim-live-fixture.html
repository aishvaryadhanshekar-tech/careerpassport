<!doctype html>
<meta charset="utf-8" />
<title>interim live fixture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap");
  * { box-sizing: border-box; }
  body {
    margin: 24px;
    font-family: Inter, system-ui, sans-serif;
    background: #f4f5f7;
    color: #1f1b16;
  }
  .composer {
    max-width: 960px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e2e6e9;
    border-radius: 16px;
    padding: 0 0 14px;
  }
  .composer-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #e2e6e9;
  }
  .composer-canvas-wrap { position: relative; }
  .composer-canvas,
  .composer-canvas-mirror {
    width: 100%;
    min-height: 240px;
    padding: 16px 18px;
    line-height: 1.55;
    font: inherit;
    letter-spacing: inherit;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .composer-canvas {
    position: relative;
    z-index: 1;
    display: block;
    resize: vertical;
    border: 0;
    background: transparent;
    color: #1f1b16;
  }
  .composer-canvas.live {
    color: transparent;
    caret-color: #1f1b16;
  }
  .composer-canvas-mirror {
    position: absolute;
    inset: 0;
    min-height: 0;
    overflow: hidden;
    pointer-events: none;
    color: #1f1b16;
  }
  .interim-inline {
    font-style: italic;
    color: #9aa0a6;
  }
  .composer-foot {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px 4px;
  }
</style>
<div class="composer">
  <div class="composer-head"><strong>Recording</strong></div>
  <div class="composer-canvas-wrap">
    <div class="composer-canvas-mirror" aria-hidden="true">
      Senior backend engineer, 5–8 years,<span class="interim-inline"> Bangalore hybrid, ownership of payments</span>
    </div>
    <textarea class="composer-canvas live">Senior backend engineer, 5–8 years,</textarea>
  </div>
  <div class="composer-foot"><span>Add files</span><span>●</span></div>
</div>
